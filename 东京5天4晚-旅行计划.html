<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316202b'/><rect x='6' y='14' width='20' height='4' rx='2' fill='%23f2b544'/></svg>">
<title>東京 5日間 巡礼 · 2026.10.02–10.06</title>
<style>
:root{
  --bg:#eef2f3; --card:#fff; --card2:#f6f9f9; --line:#cfd9dd; --line2:#e4ebed;
  --tx:#12202a; --tx2:#4b5c66; --tx3:#616f76;
  --flap:#9a6a08; --shu:#c2372a; --ai:#0a6b7c; --ok:#2f7d43;
  --board:#16202b; --board2:#101925; --bTx:#f2b544; --bMute:#93a3b1;
  --r:12px; --tap:48px;
  --hair:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101820; --card:#19242e; --card2:#141d26; --line:#2d3c49; --line2:#23303b;
    --tx:#e9eef2; --tx2:#b2c0ca; --tx3:#8a99a4; --flap:#f2b544; --shu:#ff7a6b; --ai:#6fd0e0; --ok:#7fb069; }
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"PingFang SC","Hiragino Sans","Noto Sans JP","Microsoft YaHei","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.72;letter-spacing:.01em;overscroll-behavior-y:none}
img{max-width:100%;display:block}
a{color:var(--ai)}
h1,h2,h3,h4,h5{margin:0;font-weight:650;line-height:1.4}
.jpfont,.jp,.ro,#sayBig{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN","PingFang SC",sans-serif}
.shell{max-width:560px;margin:0 auto;padding:0 14px}

/* ── 顶部：标题（矮） ───────────────── */
.slim{background:var(--board2);color:var(--bMute);font-size:11.5px;letter-spacing:.05em;padding:6px 0}
.slim b{color:var(--bTx);font-weight:700;letter-spacing:.08em;font-size:13px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.slim .back{color:var(--bMute);text-decoration:none;border:1px solid #33424f;border-radius:3px;
  padding:1px 6px;font-size:10.5px;margin-right:7px;letter-spacing:.02em;display:inline-block}
.slim .back:active{background:#1b2733;color:#dbe6ee}

/* ── 实时状态条（粘顶，最高优先） ─────── */
.status{position:sticky;top:0;z-index:650;background:var(--board);color:#fff;border-bottom:1px solid #2c3a49}
.status-in{max-width:560px;margin:0 auto;padding:6px 14px;display:flex;align-items:center;gap:9px;min-height:42px}
.clock{flex:none;display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums;color:var(--bTx);font-weight:700;font-size:17px}
.clock em{font-style:normal;font-size:10.5px;color:var(--bMute);letter-spacing:.08em;font-weight:400}
.next{min-width:0;flex:1;display:flex;align-items:baseline;gap:6px;font-size:12.5px;white-space:nowrap;overflow:hidden}
.next .nl{flex:none;color:var(--bMute);font-size:10.5px}
.next .nn{flex:1;min-width:0;overflow:hidden;color:#fff;font-weight:600;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.next .nt{flex:none;color:var(--bTx);font-weight:700;font-variant-numeric:tabular-nums}
.jump{flex:none;border:1px solid #3b4b5c;background:#1b2733;color:#dbe6ee;border-radius:8px;padding:5px 9px;font-size:11px;font-family:inherit;min-height:30px;display:none}
.jump.on{display:inline-block}
.topbtn{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--tx2);
  border-radius:99px;padding:8px 12px;font-size:11.5px;font-family:inherit;min-height:40px;cursor:pointer}
.topbtn:active{background:var(--line2)}
.sheet{position:fixed;inset:0;z-index:880;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-head{flex:none;background:var(--board);color:#fff;border-bottom:1px solid #2c3a49;
  padding:calc(9px + env(safe-area-inset-top, 0px)) 0 9px}
.sheet-head .in{max-width:560px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.sheet-head b{flex:1;font-size:15px;color:var(--bTx);letter-spacing:.05em}
.sheet-head button{flex:none;border:1px solid #3b4b5c;background:#1b2733;color:#dbe6ee;border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-family:inherit;min-height:34px;cursor:pointer}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 0 calc(26px + env(safe-area-inset-bottom, 0px))}
.sheet-body .in{max-width:560px;margin:0 auto;padding:0 14px}

/* ── 日期 chip 条（粘顶第二行） ───────── */
.days-bar{position:sticky;top:var(--shpx,42px);z-index:640;background:var(--card);border-bottom:1px solid var(--line);transition:transform .22s ease}
.days-bar.hide{transform:translateY(-115%)}
.days-bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 14px}
.chipwrap{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 0,#000 86%,transparent 100%)}
.chipwrap::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:99px;padding:8px 12px;font-family:inherit;font-size:12.5px;font-variant-numeric:tabular-nums;min-height:40px;display:flex;align-items:center;gap:5px;cursor:pointer}
.chip[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.chip[aria-selected="true"] .w{color:#ffe3df}
.chip.is-today::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--shu);flex:none}
.chip[aria-selected="true"].is-today::before{background:#fff}

/* ── 视图容器 ─────────────────────────── */
main{padding:14px 0 calc(26px + env(safe-area-inset-bottom, 0px))}

/* ── 当天概览：路线条 ─────────────────── */
.dayhead{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.dayhead .t{font-size:15.5px;font-weight:700}
.dayhead .d{font-variant-numeric:tabular-nums;color:var(--shu);font-family:"Hiragino Mincho ProN",serif;
  font-size:17px;font-weight:700}

.wxstrip{display:flex;align-items:center;gap:9px;height:42px;margin:0 0 10px;padding:0 12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:13px;
  overflow:hidden;white-space:nowrap;cursor:pointer}
.wxstrip .wt{flex:0 1 auto;min-width:3em;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--tx)}
.wxstrip .wn{flex:none;font-variant-numeric:tabular-nums}
.wxstrip .wpop{flex:none;color:var(--ai);font-variant-numeric:tabular-nums}
.wxstrip .wxrf{flex:none;margin-left:auto;color:var(--tx3);font-size:13px;padding:0 2px}
.wxstrip .src{flex:none;font-size:11px;color:var(--tx3)}
.wxstrip.loading{opacity:.45}
.wxstrip.dead{opacity:.8}
.sk{display:inline-block;height:11px;border-radius:6px;background:var(--line2);flex:none;vertical-align:middle}
.wxcmp{background:var(--card);border:1px solid var(--ai);border-radius:var(--r);padding:11px 13px;margin:0 0 10px}
.wxcmp h4{font-size:12px;color:var(--ai);letter-spacing:.06em;margin-bottom:7px}
.wxcmp .opt{padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}
.wxcmp .opt:first-of-type{border-top:0}
.wxcmp .opt b{display:block;font-size:13px}
.wxcmp .opt .o1{display:block;color:var(--tx2);font-variant-numeric:tabular-nums;margin-top:2px;font-size:13px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxcmp .opt .o2{display:block;color:var(--tx);font-variant-numeric:tabular-nums;font-size:12.5px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxcmp .hint{margin:7px 0 0;font-size:12px;color:var(--tx3)}
.daytips{margin:0 0 12px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--r);font-size:13.5px;color:var(--tx2)}
.daytips ul{margin:0;padding-left:17px}
.daytips li{margin-bottom:3px}

/* ── 站点卡 ───────────────────────────── */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:15px;bottom:20px;width:2px;background:var(--line2)}
.ti{display:flex;gap:10px;position:relative;padding-bottom:7px;scroll-margin-bottom:100px}
.ti:last-child{padding-bottom:0}
.tdot{flex:none;width:24px;height:24px;margin-top:7px;border-radius:50%;background:var(--card);
  border:2px solid var(--line);color:var(--tx3);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.tbody{min-width:0;flex:1}
.trow{width:100%;display:flex;align-items:baseline;gap:9px;text-align:left;font-family:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:38px;
  color:var(--tx);cursor:pointer}
.trow:active{background:var(--card2)}
.twhen{flex:none;min-width:74px;color:var(--flap);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.tname{flex:1;min-width:0;font-size:14.5px;font-weight:650}
.tname .tn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.tname .tmove{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;
  font-size:11.5px;font-weight:400;color:var(--tx3);margin-top:1px;letter-spacing:.01em}
.tchev{flex:none;color:var(--tx3);font-size:11px;transition:transform .18s ease}
.ti.open .tchev{transform:rotate(180deg)}
.tdetail{display:none;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px}
.ti.open .tdetail{display:block}
.ti.open .trow{border-color:var(--ai);border-radius:10px 10px 0 0}
.ti.open .tdetail{border-radius:0 0 var(--r) var(--r);border-top:0}
.tdetail .rv{margin:0 0 7px;font-size:14px;color:var(--tx2);line-height:1.7}
.tdetail .rv:last-child{margin-bottom:0}
.tdetail .tfull{font-size:15.5px;font-weight:700;line-height:1.5;margin:0 0 3px}
.tdetail .roname{font-size:12px;color:var(--tx3);margin:0 0 7px}
.ti.past .tdot{background:var(--line2);border-color:var(--line2);color:var(--tx3)}
.ti.past .trow{opacity:.9}
.ti.past .tname{font-weight:500}
.ti.now .tdot{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.ti.now .trow{border-color:var(--shu);border-left-width:3px}
.ti.now .twhen{color:var(--shu)}
.allexp{flex:none;margin-left:auto;align-self:center;border:1px solid var(--line);background:var(--card2);
  color:var(--tx2);border-radius:99px;padding:6px 10px;font-family:inherit;font-size:11px;min-height:34px;cursor:pointer}
.grm{margin:9px 0 0;padding:8px 10px;background:var(--card2);border-left:3px solid var(--ai);border-radius:0 8px 8px 0}
.grm .gl{font-size:10.5px;font-weight:700;color:var(--ai);letter-spacing:.08em}
.gr{margin-top:5px;line-height:1.55}
.gr .ge{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
a.ge{color:var(--ai);text-decoration:underline}
.gr .gn{font-size:12.5px;color:var(--tx2)}
.gr .gs{font-size:12.5px;font-weight:700}
.restbox{margin:0 0 10px;padding:9px 12px;background:var(--card2);border:1px dashed var(--line);border-radius:var(--r);font-size:12.5px;color:var(--tx2)}
.restbox b{display:block;color:var(--ai);font-size:11px;letter-spacing:.05em;margin-bottom:5px;font-weight:650}
.restbox span{display:inline-block;margin:0 12px 3px 0;white-space:nowrap}
.restbox i{font-style:normal;color:var(--tx3);font-variant-numeric:tabular-nums}
.pastsum{margin:0 0 8px 34px;font-size:11.5px;color:var(--tx3);letter-spacing:.04em}
.srow{display:flex;gap:10px;align-items:baseline}
.when{flex:none;min-width:76px;color:var(--flap);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700}
.what{min-width:0;flex:1}
.what h5{font-size:15.5px;font-weight:700;display:flex;flex-wrap:wrap;gap:5px;align-items:baseline}
.what h5 .ro{font-size:11px;color:var(--tx3);font-weight:400}
.what p{margin:6px 0 0;font-size:14px;color:var(--tx2)}
.meta{margin-top:7px;font-size:12.5px;color:var(--tx2);line-height:1.75}
.meta b{color:var(--flap);font-weight:650}
.meta .danger{color:var(--shu);font-weight:650}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.act{flex:1;min-width:96px;min-height:var(--tap);border:1px solid var(--line);background:var(--card2);color:var(--tx);
  border-radius:10px;font-family:inherit;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;
  text-decoration:none;padding:0 10px;cursor:pointer}
.act.nav{border-color:var(--ai);color:var(--ai)}
.act.say{border-style:dashed;border-color:var(--ai);background:color-mix(in srgb,var(--ai) 9%,transparent);
  color:var(--tx);text-align:left;flex-direction:column;align-items:flex-start;padding:9px 11px;gap:2px;flex-basis:100%}
.act .lbl{font-size:11px;color:var(--ai);letter-spacing:.02em}
.act .jpt{font-size:15.5px;font-weight:650;line-height:1.45}
.act .rot{font-size:11px;color:var(--tx2)}
.act:active{background:var(--line2)}
.photo{margin-top:9px}
.photo img{width:100%;height:190px;object-fit:cover;border-radius:9px}
.badge{display:inline-block;font-size:11px;color:var(--flap);border:1px solid var(--flap);
  border-radius:99px;padding:1px 8px;margin-top:8px}
.reminder-badge{display:inline-block;font-size:11px;color:var(--shu);border:1px solid var(--shu);
  border-radius:99px;padding:1px 8px;margin-top:8px}
.alt{margin-top:9px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--card2);font-size:13.5px}
.alt b{color:var(--ai);font-size:13px}
.alt p{margin:4px 0 0;color:var(--tx2)}
.diningbox{margin-top:12px}
.cnt{margin-left:7px;font-size:11px;color:var(--tx3);font-weight:400;letter-spacing:.02em}
.meal{padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.meal:first-of-type{border-top:0}
.meal .place{font-weight:650}
.meal .hrs{color:var(--tx3);font-size:12.5px}
.dish{display:inline-block;margin:4px 10px 0 0;font-size:12.5px;color:var(--tx2)}
.dish b{color:var(--flap);font-variant-numeric:tabular-nums;font-weight:700}

/* ── 短语 / 应急 ─────────────────────── */
.ph{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;font-family:inherit;color:var(--tx);cursor:pointer;min-height:var(--tap)}
.ph:active{background:var(--card2)}
.ph .cn{display:block;font-size:12.5px;color:var(--tx3)}
.ph .jpt{display:block;font-size:16.5px;font-weight:700;margin-top:2px}
.ph .rot{display:block;font-size:12px;color:var(--tx2);margin-top:2px}
.zoom{display:inline-block;margin-top:6px;font-size:10.5px;color:var(--ai);border:1px solid var(--ai);
  border-radius:99px;padding:0 7px;line-height:1.7}
.hotel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.hotel .big{font-size:16.5px;font-weight:700;line-height:1.5}
.hotel .rot{font-size:12.5px;color:var(--tx2);margin-top:4px}
.hotel .cn{font-size:13px;color:var(--tx3);margin-top:4px}
.hotel .ad{font-size:13px;margin-top:8px}
.grp{margin-bottom:14px}
.grp h3{font-size:11.5px;color:var(--tx3);letter-spacing:.08em;margin-bottom:7px}

/* ── 地图 ─────────────────────────────── */

/* ── 贴士页零件 ───────────────────────── */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:650;font-size:14.5px;
  display:flex;align-items:center;gap:8px;min-height:var(--tap)}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--tx3);font-size:12px;margin-left:auto}
details[open] summary::after{content:"▴"}
details .bd{padding:0 14px 14px;border-top:1px solid var(--line2);font-size:14px}
.k{color:var(--tx3);font-size:11.5px;letter-spacing:.04em;display:block;margin:11px 0 3px}
.k:first-child{margin-top:4px}
.row{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.row:first-of-type{border-top:0}
.row .code{font-variant-numeric:tabular-nums;color:var(--flap);font-weight:700;flex:none}
.row .t{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border:1px solid var(--line);border-radius:99px;color:var(--tx2);margin-left:5px}
.tag.booked{border-color:var(--ok);color:var(--ok)}
.tier{font-size:11.5px;color:var(--flap);flex:none;min-width:38px;font-weight:650}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:9px 0;border-top:1px solid var(--line2);font-size:14px;display:flex;gap:9px}
.tips li:first-child{border-top:0}
.tips li .n{color:var(--flap);font-variant-numeric:tabular-nums;font-size:11.5px;flex:none;min-width:20px;font-weight:700;padding-top:3px}
.disclaimer{font-size:12px;color:var(--tx2);line-height:1.7;border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;background:var(--card2);margin-top:10px}
.warn{border-left:4px solid var(--shu);background:color-mix(in srgb,var(--shu) 9%,transparent);
  padding:10px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;margin-bottom:10px}
.warn b{color:var(--shu)}

/* ── 硬规则 / 砍掉清单 ─────────────────── */
.snote{font-size:12.5px;color:var(--tx2);line-height:1.7;margin:0 0 11px}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.65}
.rl li:first-child{border-top:0}
.rl li .rid{flex:none;min-width:42px;font-size:11px;font-weight:700;color:var(--shu);
  font-variant-numeric:tabular-nums;padding-top:3px}
.cutl{list-style:none;margin:0;padding:0}
.cutl li{padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.65}
.cutl li:first-child{border-top:0}
.cutl li .cw{font-weight:650;display:block;margin-bottom:2px}
.cutl li .cy{color:var(--tx2);font-size:13px}

/* ── 底部 Tab bar ─────────────────────── */

/* ── 大字浮层 ─────────────────────────── */
#sayOut{position:fixed;inset:0;z-index:900;display:none;background:var(--card);
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + var(--hair));
  flex-direction:column;justify-content:center;text-align:center}
#sayOut.on{display:flex}
#sayBig{font-size:clamp(27px,8.4vw,46px);line-height:1.5;font-weight:700}
#sayRo{font-size:15px;color:var(--tx2);margin-top:15px}
#sayCn{font-size:15px;color:var(--tx3);margin-top:11px;border-top:1px solid var(--line2);padding-top:13px}
#sayOut .hint{margin-top:26px;font-size:12.5px;color:var(--tx3)}
</style>
</head>

優先席（博愛座）附近盡量別講話。","手扶梯：**東京「靠左站、右側通行」**（大阪相反）。拖行李別站在通道側。","街上幾乎沒有垃圾桶 → 帶個小袋子，垃圾帶回酒店或丟便利店回收箱。","公廁多數**沒有擦手紙**，帶小毛巾或濕紙巾；免治馬桶按鈕在牆上。","拉麵店多用**食券機**（先買券再入座）；居酒屋會收「お通し」小菜費約 ¥300–500，不是被坑。","**不用給小費**。找零放回櫃檯小托盤，不要直接塞給店員。","拍照：**竹むら店內禁止拍照**（門口拍外觀可以）；神社參道別邊走邊吃；電車內別拍到陌生人。神社參拜：手水舍洗手 → 二拜二拍手一拜。","免稅：同一家店當日滿 ¥5,000 可退稅，**帶護照**，部分店要當場辦。","交通：進出站都刷同一張 Suica（或同一支手機）；**餘額不足會卡閘門**，先到精算機補。山手線末班約 00:30。","迷路別慌：新宿駅、渋谷駅出口極多，認「○○方面」指示牌＋Google マップ 的**出口編號**（如 A6 出口）最準。","**日本常见「同一个地名、却是不同的站」**：江ノ島駅（江ノ電）／片瀬江ノ島駅（小田急）／湘南江の島駅（モノレール）是三个站；つくばエクスプレス秋葉原駅 与 JR秋葉原駅 也是两个站（相距 350m）。**认站名全称，不要只认地名**——Google マップ 搜「○○駅」而不是「○○」。","電車極準時：每段**提前 3–5 分鐘**到月台；日本「遲 1 分鐘」就是遲到。","**最远的一天是 10-04（江の島・鎌倉，單程 1 小時以上）**——回程電車上就把行李收好。**10-05 全室內、走動少，但 10-06 要 04:45 起床**：所以 10-05 晚上 22:00 前打包完、21:00 上床。","颱風／計画運休備案：真正怕停駛的是 **10-04（小田急・江ノ電）**——當天早上先看小田急與江ノ電官網的運行情報，停駛就改「上野→淺草→東京駅」平地線。10-05 全在室內（渋谷・池袋），下雨不影響。","**宿泊税**：東京都對每人每晚 10,000–15,000 円收 ¥100、15,000 円以上收 ¥200（未滿 10,000 円免稅）；**2026-06-01 之後預訂的方案才需入住時現地另付**（之前預訂的已含在房價內）。2 人 4 泊約 ¥800–1,600，刷卡或現金視酒店。","手機沒電＝最麻煩的事：帶充電寶＋一條線，演唱會日務必先充滿。","**认路靠出口编号，不靠站名**：日本大站（新宿・渋谷・池袋・東京）同一站有十几个出口，方向可能完全相反。出闸后**先看「○○方面」指示牌＋Google マップ 的出口编号**（如 A6 出口），比问路快。本页每一段的**出入口**都写在该格的正文末尾。"],"reminders":[{"item":"Visit Japan Web 登記入境與稅關 QR（截圖存手機）","leadDays":7},{"item":"準備日圓現金 2–3 萬（竹むら等老店不收卡）","leadDays":7},{"item":"網路方案：eSIM 或漫遊包（先裝好並測試）","leadDays":5},{"item":"PJSK 感謝祭門票確認＋護照＋充電寶","leadDays":3},{"item":"Skyliner 指定席（返程 10-06 05:40 班次）","leadDays":2},{"item":"折疊傘・小毛巾（日本公廁常無擦手紙）","leadDays":1}],"days":[{"date":"2026-10-02","weekday":"周五","theme":"落地 · μ's 秋葉原巡禮","tips":["落地到 9:36 发车只有约 76 分钟（入境＋行李＋买票＋找闸口）；**Visit Japan Web 二维码事前填好**；赶不上就 9:53。","**先取券还是先补眠？二选一，别两头空**：①**方案A（推薦，熱門日首選）**：入境顺利就別睡——10:30 直接到秋葉原取整理券再回酒店，券到手才睡得踏实；②**方案B**：照時間軸 10:27–12:45 先補眠，13:00 再去取券（風險：當天是聯動熱門日，店頭券可能已發完）。","**キュアメイド整理券＝排队号（不能指定时间，叫到后 20 分钟不到就作废）。**取到号先问「あと何分ぐらいですか？」——**超过 1.5 小时**才敢走去アメ横／神田明神／竹むら；**40 分以内**就留在秋葉原等叫号，或直接放弃、改到 10-05 傍晚（**竹むら只能今天**，10-03 已排满、10-04/10-05 休、10-06 早上飞走）。","**Suica 充到 ¥10,000+**（江ノ電鎌倉駅换乘口 是 10 分）。**提前致电申请 12:00 アーリーチェックイン（¥2,200/小时）**，12:00 入房、**12:45 前出門** → 實際最多睡 **45 分**（通宵转机后全天最值的一段）。入住前可免费寄存行李。 **出入口**：TX **新御徒町駅 A4 出口**（小島1・2丁目方面）離酒店最近（约 214m）。","openingHours":"check-in 15:00／check-out 11:00（以酒店為準）","transport":{"mode":"步行／計程車 京成上野駅 → ホテル","fare":"免費／約 ¥1,200","duration":"約 25 分（帶行李）／計程車 6 分"},"jp":"荷物を預かってもらえますか？","romaji2":"Nimotsu o azukatte moraemasu ka?","jpnote":"还没到 check-in 时间，想先寄放行李"},{"period":"afternoon","name":"秋葉原：取キュアメイド整理券","romaji":"Onoden Biru（オノデンビル）","time":"13:00–13:30","lat":35.6991,"lng":139.7714,"review":"**整理券是「排队号」：不能指定时间，叫到号后 20 分钟不到就作废。**取券两条路：GPS 线上 10:30 起（手机版 LINE 的 matoca，**必须在オノデンビル附近**才能发券）／店头 11:00 起。90 分制，食物 L.O. 19:00（过 L.O. 有券也不进）。\n**取到号先问店员一句「あと何分ぐらいですか？」**，再决定怎么走：\n・**还有 1.5 小时以上** → 照原计划：アメ横午餐 → 神田明神 → 竹むら，路上用手机盯 matoca 的叫号，差不多就回秋葉原。\n・**40 分以内** → 别走远。**竹むら 是「只能今天」的**（火–土营业：10-03 六已被演唱会＋花火排满、10-04 日休、10-05 一休、10-06 二早上就飞走），所以只能二选一：先冲竹むら（15:40–16:25，离开后 16:35 回秋葉原）碰运气，或**放弃今天的キュアメイド、改到 10-05 傍晚**（它每天 11:00–20:00，10-05 你在池袋，可以挤掉一家店）。\n※ つくばエクスプレス秋葉原駅 和 JR秋葉原駅 **是两个不同的站**（相距约 350m、有高低差，走 5–10 分）；明天早上要在这里换 JR，先记住这件事。 **出入口**：TX 秋葉原駅は **A1 出口**（JR線のりかえ口・東西自由通路＝秋葉原電気街方面）。オノデン官方写法是「JR秋葉原駅 電気街口から徒歩2分」。","transport":{"mode":"つくばエクスプレス 新御徒町駅 → 秋葉原駅（1 站・**A1 出口**＝JR乗換口/電気街方面）＋步行 5 分到オノデンビル","fare":"約 ¥180","duration":"約 15 分"}},{"period":"noon","name":"アメヤ横丁：小吃＋午餐","romaji":"Ameya Yokochō","time":"13:45–14:40","lat":35.710024,"lng":139.774541,"photo":"https://upload.wikimedia.org/wikipedia/commons/b/bb/Ameyoko_Market.jpg","review":"上野最方便的午餐圈：海鮮丼、串燒、水果串一路吃。人多但翻桌快，別排超過 20 分鐘的隊。 **出入口**：从秋葉原往アメ横走**電気街口（西侧）**出，沿中央通り向北约 1.3km。（TX 秋葉原同样走 A1 → 东西自由通路 → 電気街口方面）","openingHours":"多數店 10:00–19:30","ticketPrice":"海鮮丼 約 ¥1,000–2,000","transport":{"mode":"步行 秋葉原【電気街口方面】→ アメヤ横丁（御徒町端）（約 15 分）","fare":"—","duration":"約 15 分"},"jp":"これください。","romaji2":"Kore o kudasai.","jpnote":"路邊攤指著想吃的東西說","gourmet":[{"s":"牛かつ あおな 御徒町本店","d":"牛かつ","ep":"2016-05-21","t":"肉汁デスマッチ（牛かつ部門）","n":"上野6-5-7・離酒店 5 分","u":"https://www.ntv.co.jp/arashinishiy 侧最大号数降到 6 号，川崎侧相对更值。田園都市線「二子新地」下车即到，川崎侧还有终曲「川崎ナイトライト」。"},{"label":"穴场：宇奈根公園・多摩川遊園（野毛）","summary":"两岸都能看、人多得慢，代价是多走一点（离站约 20 分）。不想买票又想松一点就选这里。"}],"rest":[{"t":"11:30–12:30","w":"入座等開演（演唱會全場坐）"},{"t":"15:00–16:15","w":"電車約 60 分（有座算運氣）"},{"t":"19:30–21:10","w":"回程電車約 60–80 分（花火後官方呼籲停留約 30 分再走）"}]},{"date":"2026-10-04","weekday":"周日","theme":"七里ヶ浜・鎌倉高校前・江の島（『陽だまりの彼女』巡礼）","tips":["**今天的顺序是「先遠後近」**：藤沢 → **七里ヶ浜（先坐到最遠）→ 鎌倉高校前 → 江の島**。江ノ電是单线，会先经过江の島才到七里ヶ浜，再一路折回——这是刻意避开中午江の島的人潮。","**回程走湘南モノレール**（江の島 → 湘南江の島駅 → 大船 → 上野東京ライン → 上野，約 1 小时 35 分（含步行）、换 1 次），比经新宿（約 1 小时 50 分）快 20–25 分钟。**江ノ電「江ノ島駅」与モノレール「湘南江の島駅」是两个不同的站**（**出口 B 改札**出去即到，約 3–5 分）。","**江ノ電单买更划算**：藤沢→七里ヶ浜 ¥260＋七里ヶ浜→鎌倉高校前 ¥200＋鎌倉高校前→江ノ島 ¥200＝**¥660**；**のりおりくん ¥800 只有在坐第 4 段以上才划算**，本路线回程不走江ノ電，所以单买。（江ノ電官网首页那条运价改定是**巴士**的，电车运价没变。）","**エスカー只上不下**（官方 FAQ 原文），下山全程台阶/坡道；**シーキャンドルセット券 ¥1,100**（エスカー＋コッキング苑＋塔）比单买省 ¥200。","**岩屋可能因浪高临时闭洞**（官方写明「荒天時は閉鎖・時間変更」）→ 当天先看藤沢市観光首页的「本日の営業時間」与官方 FB；有过「因岩屋可能闭洞而停售 1day 券」的前例。","**鎌倉高校前**：官方摄影区在**腰越ラッコ公園**，官方只呼吁「**私有地立入禁止・路上駐停車防止**」；**2026-10-04 当天是否仍管制未能查证** → 别在马路上久留、别进民宅地界。","**紀の国屋本店**：官网只写 9:00–18:00，**定休日、价格、能否刷卡全都没写**（二手说周三定休，10-04 周日照理开店）→ **带现金**。","**天气**：出门前把 tenki.jp 与 気象庁 各看一次（两个官方来源常不一致，按差的那个准备）；若真下雨，按 R7 改**新江ノ島水族館**（全室內、就在弁天橋旁）。","**为什么不更早／不更晚**：七里ヶ浜放在第一站，所以本来就踩不到平交道最空的时段（鎌倉市秩序实验窗口是 9:00–16:00）——**07:20 出发是折中**：多睡一小时，09:45 到七里ヶ浜、10:35 到平交道。**若想看日落要另付钱**：コッキング苑 **9–17 时免费、17 时以后 ¥500**（有活动时还要加夜间券），塔本身 ¥800（セット券 ¥1,100 已含）——即留到 18:00 看日落，两人要多付约 ¥1,000。江の島西侧**稚児ヶ淵**是不花钱的日落位；留到 18:00 走，回上野约 **20:00**（不是 19:30）。","**上车/买票两条最实用的**：①小田急在**新宿**只上「**藤沢行き／片瀬江ノ島行き**」的快速急行（开往小田原・箱根湯本的不经过藤沢）；②岛上买**「江の島1day」¥1,550**（含エスカー＋苑＋展望灯台＋**岩屋**＋水族館），比「セット券 ¥1,100＋岩屋 ¥500」划算；现地可在エスカー1区乗場或片瀬江ノ島観光案内所买，**Suica／信用卡／PayPay 可**。","**现金要带够**：这五家铁道（都営・小田急・江ノ電・湘南モノレール・JR）**全部能刷 Suica**；但以下**只能现金**——江島神社 御朱印／授与所、奉安殿 ¥200、岩屋 ¥500、**龍恋の鐘的挂锁**、紀の国屋本店女夫饅頭、仲見世各摊。建议 2 人带 **现金 ¥10,000–15,000**，Suica 留 **≥¥2,000**。"],"slots":[{"period":"morning","name":"新御徒町駅 → 新宿駅 → 藤沢駅","time":"07:20–09:20","lat":35.33853,"lng":139.48763,"review":"去程走小田急：新御徒町 →（都営大江戸線）→ **新宿西口駅** → 走 B1F 地下通路到 **小田急【西口地下改札口】** → 小田急快速急行 → 藤沢（約 60 分，有座）。**★上车前一定看清行先：只上「藤沢行き／片瀬江ノ島行き」——快速急行也有开往「小田原・箱根湯本」的，那班根本不经过藤沢。**。**今天刻意「先遠後近」**：先坐江ノ電到最遠的七里ヶ浜，再一路往回玩，避开中午江の島的人潮。","transport":{"mode":"都営大江戸線 新御徒町駅 → 新宿西口駅／小田急快速急行 新宿駅 → 藤沢駅（閘機各自獨立，走地下連絡通道）","fare":"約 ¥850（都営 ¥220＋小田急；以官網為準）","duration":"約 120 分"},"romaji":"Shinjuku → Fujisawa"},{"period":"morning","name":"七里ヶ浜：海岸（江の島を望む）","time":"09:45–10:30","lat":35.30625,"lng":139.51,"review":"江ノ電で藤沢から **21 分・260 円（8 站）**。**海岸就在站旁（徒步約 2 分）**，约 2.9km 的浜，以「海越しの富士山」闻名；想同时收进**江の島＋富士山**，再坐一站到**稲村ガ崎**是官方点名的机位。早上人少，先把这段走掉。**出入口**：七里ヶ浜駅有 2 个出口（藤沢方・鎌倉方），**站员窗口 9:45–17:20**；海岸侧官方构内图未标，出站往海的方向走即可。","transport":{"mode":"江ノ電 藤沢駅 → 七里ヶ浜駅（8 站・会先经过江ノ島／鎌倉高校前）","fare":"¥260","duration":"約 21 分"},"romaji":"Shichirigahama"},{"period":"morning","name":"鎌倉高校前駅：平交道（スラムダンク聖地）","time":"10:35–11:15","lat":35.30672,"lng":139.50056,"review":"江ノ電で七里ヶ浜から **1 站・2 分・200 円**。**官方对策**：摄影区设在**腰越ラッコ公園**（同一机位），并明确呼吁**私有地立入禁止・路上駐停車防止**——不曾在路上久留、别进民宅地界。**2026-10-04 当天是否仍在实施管制，官网未能查证**，看到人多就拍一张即走。**出入口**：鎌倉高校前是**終日无人站**，有 2 个出口（藤沢方・鎌倉方）；踏切就在站旁，官方没标该走哪侧。","transport":{"mode":"江ノ電 七里ヶ浜駅 → 鎌倉高校前駅（1 站）","fare":"¥200","duration":"約 2 分"},"romaji":"Kamakurakōkōmae"},{"period":"morning","name":"江ノ島駅 → 江の島：弁天橋を渡る","time":"11:20–11:45","lat":35.30211,"lng":139.47999,"review":"江ノ電で鎌倉高校前から **2 站・4 分・200 円**到江ノ島駅。**从江ノ島駅到江島神社官方写「徒歩 15 分」**（含过弁天橋，桥上风大）。**回程也是这一段**，所以下山时间要留足。**出闸后跟「江の島・弁天橋」指示走**（江ノ電构内图只标了 A 改札→小田急、B 改札→モノレール，没标江の島侧出口）。","transport":{"mode":"江ノ電 鎌倉高校前駅 → 江ノ島駅／步行 江ノ島駅 → 弁天橋 → 江島神社（官方：徒歩 15 分）","fare":"¥200","duration":"約 20 分"},"romaji":"Enoshima"},{"period":"noon","name":"江島神社 辺津宮（下の宮）","time":"11:45–12:15","lat":35.30025,"lng":139.47946,"review":"江島神社是**三宫（辺津宮・中津宮・奥津宮）**的总称，**辺津宮是上岛后最先到的一座**（朱の鳥居→石段 3–5 分）。**授与所／社務所 8:30–17:00**；**奉安殿 8:30–16:30、¥200**。这一片也是全岛最像电影开场的地方。","transport":{"mode":"步行 江島神社 境内","fare":"奉安殿 ¥200","duration":"—"},"romaji":"Hetsunomiya","ticketPrice":"奉安殿 ¥200（**現金**）＋御朱印／授与品（**現金**，价格官網未列）"},{"period":"noon","name":"『陽だまりの彼女』巡礼＋午餐：エスカー → 中津宮 → コッキング苑・展望灯台","time":"12:15–13:45","lat":35.29971,"lng":139.47814,"review":"**先说清楚**：这部电影在江の島**没有官方逐点取景清单**（只有藤沢市観光協会的《ロケ地マップ》收录本片）。下面是粉丝常用的对位走法，气氛最接近：**エスカー（自动扶梯）→ 中津宮 → サムエル・コッキング苑・江の島 展望灯台（シーキャンドル）**。**エスカー只上不下**（官方原文），下山走台阶。**★午餐就排在这里**：コッキング苑内有 LONCAFE（休日 10:00–20:00）与 TODAI KITCHEN（10:00–19:00），有座——**别等到 15:40 的仲見世才想吃，仲見世约 11:00–15:00 就收了**。**セット券 ¥1,100**（エスカー＋苑＋塔）比单买省 ¥200；苑 9–17 时免费，塔 9:00–20:00。","transport":{"mode":"步行＋エスカー（上り専用）","fare":"江の島1day ¥1,550","duration":"—"},"romaji":"Nakatsunomiya / Sea Candle","ticketPrice":"**江の島1day ¥1,550**（含エスカー＋苑＋展望灯台＋岩屋＋水族館；比「セット券 ¥1,100＋岩屋 ¥500」省且多水族館）**Suica／クレジット／PayPay 可**"},{"period":"afternoon","name":"奥津宮 → 龍恋の鐘（挂锁）→ 稚児ヶ淵","time":"13:45–14:50","lat":35.29874,"lng":139.47628,"review":"**龍恋の鐘**在島上高处的「龍野ヶ岡」，靠**奥津宮与稚児ヶ淵**之间（藤沢市江の島 2 丁目 5）；钟下围栏挂满**南京錠（挂锁）**——就是电影里那种。**官方页只给位置，没写挂锁在哪买、多少钱、几点到几点** → 到钟附近／奥津宮方向的商店问一句（**带现金**）。再往下是**稚児ヶ淵**的海蚀平台。","transport":{"mode":"步行 奥津宮 → 龍恋の鐘 → 稚児ヶ淵","fare":"挂锁現金（价格未查证）","duration":"—"},"romaji":"Tatsukoi no Kane","ticketPrice":"挂锁 **現金**（价格未查证）"},{"period":"afternoon","name":"江の島岩屋（荒天可能闭洞）","time":"14:50–15:40","lat":35.2983,"lng":139.47363,"review":"岛最深处，**营业 9:00–17:00（季节性变动）、定休無，但「荒天時は閉鎖・時間変更」**（神奈川県官方）。**票价 一般 ¥500／小学生 ¥200**。**当天先查**藤沢市観光首页的「本日の営業時間」与官方 FB——**曾有过「因岩屋可能闭洞而停售 1day 券」的前例**。","transport":{"mode":"步行 稚児ヶ淵 → 江の島岩屋","fare":"¥500","duration":"—"},"romaji":"Iwaya Caves","ticketPrice":"¥500（**現金**；官方兩處寫 9:00–17:00 與 9:00–16:00，**按 16:00 準備**，當天先查藤沢市観光「本日の営業時間」）"},{"period":"afternoon","name":"下山 → 仲見世：紀の国屋本店（女夫饅頭）","time":"15:40–16:30","lat":35.3015,"lng":139.47804,"review":"**紀の国屋本店**（藤沢市江の島 2-1-12・TEL 0466-22-5663）：官网只写 **9:00–18:00**，**没写定休日、没写价格、也没写能不能刷卡**（二手说周三定休 → **10-04 周日照理营业**）。**带现金**。女夫饅頭赏味期限：真冬约 1 周、真夏 3–4 日。顺路在仲見世吃**しらす丼／丸焼きたこせんべい**当午餐。","transport":{"mode":"步行 岩屋 → 中津宮 → 辺津宮 → 仲見世（下山約 20 分）","fare":"女夫饅頭 現金（价格未查证）","duration":"約 20 分"},"romaji":"Kinokuniya Honten","ticketPrice":"女夫饅頭 **現金**（价格未查证）"},{"per <script>
// 出发前提醒：截止日期计算 + 渲染。浏览器与 Node 双用。

// startDateISO: 'YYYY-MM-DD'；items: [{item, leadDays}]
// 返回按 deadline 升序的 [{item, leadDays, deadline}]，deadline 为 'YYYY-MM-DD'
// 用 UTC 做日期运算，避免本地时区导致的偏移。
function computeReminders(startDateISO, items) {
  return items
    .map(function (it) {
      var d = new Date(startDateISO + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() - it.leadDays);
      return { item: it.item, leadDays: it.leadDays, deadline: d.toISOString().slice(0, 10) };
    })
    .sort(function (a, b) {
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderChecklistHTML(reminders) {
  var lis = reminders.map(function (r) {
    return '<li class="todo-item">'
      + '<input type="checkbox"> '
      + '<span class="todo-deadline">' + r.deadline + '前</span> '
      + '<span class="todo-text">' + escapeHTML(r.item) + '（建议提前' + r.leadDays + '天）</span>'
      + '</li>';
  }).join('');
  return '<ul class="pretrip-todo">' + lis + '</ul>';
}

function reminderBadgeHTML(leadDays) {
  return '<span class="reminder-badge">⚠️ 建议提前' + leadDays + '天订</span>';
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    computeReminders: computeReminders,
    renderChecklistHTML: renderChecklistHTML,
    reminderBadgeHTML: reminderBadgeHTML,
  };
}

</script>
<script>
// Leaflet 地图引擎。纯函数（buildNavLink/buildMapAppLinks/routeCoordinates/gcj02ToWgs84）可单元测试；
// initTravelMap 需浏览器 + Leaflet (L)。浏览器与 Node 双用。

// HTML 转义，防止 XSS
function escapeHTML(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 生成跳转手机地图导航的链接。
// iOS 不识别 geo: scheme，用 Apple Maps 的 https 通用链接；其余平台用 geo:。
// ua 可选（浏览器里传 navigator.userAgent），不传则回退 geo:。
function buildNavLink(lat, lng, label, ua) {
  if (ua && /iPhone|iPad|iPod/.test(ua)) {
    return 'https://maps.apple.com/?ll=' + lat + ',' + lng + '&q=' + encodeURIComponent(label);
  }
  return 'geo:' + lat + ',' + lng + '?q=' + lat + ',' + lng + '(' + encodeURIComponent(label) + ')';
}

// 常用地图 App 的点位链接（免 key 的官方 URI 规范：高德 URI API、Google Maps URLs）。
// 这不是 page-contract 的 actionLink——不承载实时数据主张，只是"打开地图看这个点"。
// 境内点只给高德（Google 地图境内不可用、底图坐标系还会偏移）；境外点给 Google + 高德。
// 输入坐标一律 WGS-84：高德 URI 用 coordinate=wgs84 声明由其换算，Google 本身即 WGS-84。
// isInChinaBBox 声明在下方 GCJ 区块（函数声明有提升，此处可用）。
function buildMapAppLinks(lat, lng, label) {
  var amap = {
    label: '高德地图',
    url: 'https://uri.amap.com/marker?position=' + lng + ',' + lat
      + '&name=' + encodeURIComponent(label)
      + '&coordinate=wgs84&callnative=1&src=travel-plan-viz',
  };
  var google = {
    label: 'Google 地图',
    url: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat + ',' + lng),
  };
  return isInChinaBBox(lat, lng) ? [amap] : [google, amap];
}

// —— GCJ-02 → WGS-84 坐标转换 ——
// 高德/腾讯地图返回的坐标是 GCJ-02（国测局加密），直接画在 OSM（WGS-84）瓦片上
// 会偏移一百到几百米。凡坐标来自高德/腾讯类 skill，必须先经此函数转换。
// 中国境外坐标原样返回（GCJ-02 仅在境内加偏）。
var GCJ_A = 6378245.0;
var GCJ_EE = 0.00669342162296594323;

function isInChinaBBox(lat, lng) {
  return lng >= 72.004 && lng <= 137.8347 && lat >= 0.8293 && lat <= 55.8271;
}

function gcjTransformLat(x, y) {
  var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
  return ret;
}

function gcjTransformLng(x, y) {
  var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
  return ret;
}

function gcj02ToWgs84(lat, lng) {
  if (!isInChinaBBox(lat, lng)) return { lat: lat, lng: lng };
  var dLat = gcjTransformLat(lng - 105.0, lat - 35.0);
  var dLng = gcjTransformLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat - dLat, lng: lng - dLng };
}

// 从有序点位提取 [lat,lng] 数组，用于连线
function routeCoordinates(points) {
  return points.map(function (p) { return [p.lat, p.lng]; });
}

// 初始化地图：编号 divIcon 标记、按序虚线路线、点击弹出 名称+时间+导航链接。
// elementId: 容器 id；points: [{lat, lng, name, time}]（按行程顺序，坐标须为 WGS-84）
// opts 可选：{ tileUrl, attribution } 替换默认 OSM 瓦片源（如 OSM 访问不稳时换镜像）。
function initTravelMap(elementId, points, opts) {
  opts = opts || {};
  var map = L.map(elementId);
  L.tileLayer(opts.tileUrl || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: opts.attribution || '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  points.forEach(function (p, i) {
    var icon = L.divIcon({
      className: 'route-pin',
      html: '<span class="route-pin__num">' + (i + 1) + '</span>',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });
    var navLinks = [{ label: '导航', url: buildNavLink(p.lat, p.lng, p.name, ua) }]
      .concat(buildMapAppLinks(p.lat, p.lng, p.name));
    L.marker([p.lat, p.lng], { icon: icon }).addTo(map).bindPopup(
      '<b>' + (i + 1) + '. ' + escapeHTML(p.name) + '</b><br>'
      + (p.time ? escapeHTML(p.time) + '<br>' : '')
      + navLinks.map(function (l) {
          return '<a href="' + l.url + '">' + escapeHTML(l.label) + '</a>';
        }).join(' · ')
    );
  });

  var coords = routeCoordinates(points);
  if (coords.length > 1) {
    L.polyline(coords, { dashArray: '6 8', weight: 2 }).addTo(map);
  }
  map.fitBounds(coords.length ? coords : [[0, 0]], { padding: [30, 30] });
  return map;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    buildNavLink: buildNavLink,
    buildMapAppLinks: buildMapAppLinks,
    routeCoordinates: routeCoordinates,
    gcj02ToWgs84: gcj02ToWgs84,
    initTravelMap: initTravelMap,
  };
}

</script>

<script>
(function () {
  var trip = JSON.parse(document.getElementById('trip-data').textContent);

  /* 照片：优先用内嵌 data URI（断网也看得到） */
  function photoSrc(u) { var m = trip.photoData; return (m && m[u]) ? m[u] : u; }

  /* 本地打开（file://）时「行程一覧」没有意义，隐藏掉 */
  if (location.protocol === 'file:') { var _bk = document.getElementById('backlink'); if (_bk) _bk.style.display = 'none'; }

  /* ── 东京时间：不信任设备时区，直接按 UTC+9 推算 ───────────── */
  function jst() {
    var d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9 * 3600000);
  }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function p2(n) { return String(n).padStart(2, '0'); }
  function parseHM(s) {
    var m = String(s || '').match(/(\d{1,2}):(\d{2})/g);
    if (!m || !m.length) return null;
    function toMin(x) { var a = x.split(':'); return (+a[0]) * 60 + (+a[1]); }
    return { start: toMin(m[0]), end: m[1] ? toMin(m[1]) : toMin(m[0]), txt: m[0] };
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
  function set(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }
  function attr(x) { return JSON.stringify(x === undefined ? '' : x).replace(/"/g, '&quot;'); }

  /* ── 大字浮层 ─────────────────────────── */
  var out = document.getElementById('sayOut');
  window.__say = function (jp, ro, cn) {
    document.getElementById('sayBig').textContent = jp || '';
    document.getElementById('sayRo').textContent = ro || '';
    document.getElementById('sayCn').textContent = cn || '';
    out.classList.add('on'); document.body.style.overflow = 'hidden';
  };
  function hideSay() { out.classList.remove('on'); document.body.style.overflow = ''; }
  out.addEventListener('click', hideSay);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideSay(); });

  /* ── 状态 ─────────────────────────────── */
  var TODAY = ymd(jst()), NOWMIN = jst().getHours() * 60 + jst().getMinutes();
  var cur = 0;
  (function () {
    var i = trip.days.map(function (d) { return d.date; }).indexOf(TODAY);
    cur = i >= 0 ? i : (TODAY < trip.days[0].date ? 0 : trip.days.length - 1);
  })();
  
  /* ── 顶部时钟 + 下一站 ────────────────── */
  function slotState(dayIdx, s) {
    if (trip.days[dayIdx].date !== TODAY) {
      return trip.days[dayIdx].date < TODAY ? 'past' : 'future';
    }
    var hm = parseHM(s.time);
    if (!hm) return 'future';
    if (NOWMIN > hm.end) return 'past';
    if (NOWMIN >= hm.start && NOWMIN <= hm.end) return 'now';
    return 'future';
  }
  function tick() {
    var n = jst();
    set('clk', p2(n.getHours()) + ':' + p2(n.getMinutes()));
    NOWMIN = n.getHours() * 60 + n.getMinutes();
    TODAY = ymd(n);

    var line = document.getElementById('nextline'), jb = document.getElementById('jumpbtn');
    if (TODAY < trip.days[0].date) {
      var dd = Math.ceil((new Date(trip.days[0].date + 'T00:00:00Z') - new Date(TODAY + 'T00:00:00Z')) / 86400000);
      line.innerHTML = '<span class="nl">出发前</span><span class="nn">'
        + esc(trip.days[0].date.slice(5).replace('-', '.')) + '　' + esc(trip.days[0].theme || '')
        + '</span><span class="nt">' + dd + '天</span>';
      jb.classList.remove('on'); return;
    }
    if (TODAY > trip.days[trip.days.length - 1].date) {
      line.innerHTML = '<span class="nl">行程已结束</span><span class="nn">おつかれさま</span>';
      jb.classList.remove('on'); return;
    }
    var di = trip.days.map(function (d) { return d.date; }).indexOf(TODAY);
    var list = (trip.days[di].slots || []).map(function (s) { return { s: s, hm: parseHM(s.time) }; })
      .filter(function (x) { return x.hm; });
    var nowS = null, nx = null;
    for (var i = 0; i < list.length; i++) {
      if (NOWMIN >= list[i].hm.start && NOWMIN <= list[i].hm.end) { nowS = list[i]; break; }
    }
    for (var j = 0; j < list.length; j++) {
      if (list[j].hm.start > NOWMIN) { nx = list[j]; break; }
    }
    if (nowS) {
      line.innerHTML = '<span class="nl">进行中</span><span class="nn">' + esc(nowS.s.name)
        + '</span><span class="nt">' + esc(nowS.s.time) + '</span>';
    } else if (nx) {
      line.innerHTML = '<span class="nl">下一站</span><span class="nn">' + esc(nx.s.name)
        + '</span><span class="nt">' + nx.hm.txt + ' · ' + (nx.hm.start - NOWMIN) + '分</span>';
    } else {
      line.innerHTML = '<span class="nl">今天走完</span><span class="nn">早点回去休息</span>';
    }
    jb.classList.add('on');
  }
  tick(); setInterval(tick, 30000);
  (function () {
    var bar=document.querySelector('.days-bar'), lastY=0;
    if(!bar||!window.addEventListener) return;
    window.addEventListener('scroll', function () {
      var y=window.pageYOffset||document.documentElement.scrollTop||0;
      if(y>lastY+4&&y>90) bar.classList.add('hide');
      else if(y<lastY-4) bar.classList.remove('hide');
      lastY=y;
    }, {passive:true});
  })();
  /* 状态条高度会随「下一站」换行变化 → 让日期条始终紧贴其下 */
  function syncSticky() {
    try {
      var st = document.querySelector('.status');
      if (st && st.offsetHeight && document.documentElement && document.documentElement.style)
        document.documentElement.style.setProperty('--shpx', st.offsetHeight + 'px');
    } catch (e) {}
  }
  syncSticky();
  if (window.addEventListener) window.addEventListener('resize', syncSticky);
  document.getElementById('jumpbtn').addEventListener('click', function () {
    var el = document.querySelector('.ti.now');
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });

  /* ── 日期 chip ────────────────────────── */
  function renderChips() {
    set('chips', trip.days.map(function (d, i) {
      return '<button class="chip' + (d.date === TODAY ? ' is-today' : '') + '" data-i="' + i + '" aria-selected="'
        + (i === cur) + '">' + d.date.slice(5).replace('-', '.') + '<span class="w">' + esc(d.weekday) + '</span></button>';
    }).join(''));
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function () {
        cur = +b.getAttribute('data-i'); renderChips(); renderPlan();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  /* ── 导航链接：通用 https 深链，给「路线」而不是「一个点」 ──
     交通方式直接读行程里的 transport.mode，不猜。 */
  function navMode(s) {
    var m = String((s.transport && s.transport.mode) || '');
    if (/^步行/.test(m)) return 'walking';                       // 步行、步行（同會場）、步行至京成線月台
    if (/^計程車|^出租车|^タクシー/.test(m)) return 'driving';     // 計程車（推薦）／步行
    if (/JR|線|電|メトロ|地下鉄|地下鐵|新幹線|モノレール|バス|bus|つくば|小田急|京成|都営|スカイライナー|ロマンスカー/.test(m)) return 'transit';
    return 'walking';
  }
  function navUrl(s) {
    var d = s.lat + ',' + s.lng, t = navMode(s);
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {          // Apple 地图（系统自带）
      return 'https://maps.apple.com/?daddr=' + d
        + '&dirflg=' + (t === 'walking' ? 'w' : t === 'transit' ? 'r' : 'd');
    }
    return 'https://www.google.com/maps/dir/?api=1&destination=' + d + '&travelmode=' + t;
  }
  function navText(s) {
    var t = navMode(s);
    return t === 'walking' ? '走路去' : t === 'transit' ? '坐电车去' : '打车去';
  }

  /* ── 行程视图：可展开的竖向时间轴 ───────── */
  function detailHTML(s) {
    var meta = '';
    if (s.openingHours) meta += '<span>营业 <b>' + esc(s.openingHours) + '</b></span>　';
    if (s.closedDays) meta += '<span class="danger">' + esc(s.closedDays) + '</span>　';
    if (s.ticketPrice) meta += '<span>参考价 <b>' + esc(s.ticketPrice) + '</b></span>';
    var tr = s.transport ? '<div class="meta">交通 ' + esc(s.transport.mode)
      + (s.transport.fare ? '・' + esc(s.transport.fare) : '')
      + (s.transport.duration ? '・' + esc(s.transport.duration) : '') + '</div>' : '';
    var nav = '<a class="act nav" target="_blank" rel="noopener" href="' + esc(navUrl(s)) + '">'
      + navText(s) + '</a>';
    var say = s.jp ? '<button class="act say" onclick="__say(' + attr(s.jp) + ',' + attr(s.romaji2 || '') + ',' + attr(s.jpnote || '') + ')">'
      + '<span class="lbl">' + esc(s.jpnote || '给对方看') + '</span>'
      + '<span class="jpt jp">' + esc(s.jp) + '</span>'
      + (s.romaji2 ? '<span class="rot ro">' + esc(s.romaji2) + '</span>' : '')
      + '<span class="zoom">点开大字</span></button>' : '';
    var ph = s.photo ? '<div class="photo"><button class="act" data-src="' + esc(photoSrc(s.photo)) + '">看照片</button></div>' : '';
    return '<div class="tfull">' + esc(s.name) + '</div>'
      + (s.romaji ? '<div class="roname jpfont">' + esc(s.romaji) + '</div>' : '')
      + (s.review ? '<p class="rv">' + fmt(s.review) + '</p>' : '')
      + ((s.gourmet && s.gourmet.length) ? '<div class="grm"><div class="gl">交嵐（嵐にしやがれ）出店 · 放送期数</div>'
          + s.gourmet.map(function (g) {
              return '<div class="gr">'
                + (g.u ? '<a class="ge" href="' + esc(g.u) + '" target="_blank" rel="noopener">' + esc(g.ep) + ' 放送</a>'
                       : '<span class="ge">' + esc(g.ep) + ' 放送</span>')
                + ' ' + esc(g.t)
                + '<br><span class="gs">' + esc(g.s) + '</span>'
                + (g.d ? '・<span class="gn">' + fmt(g.d) + '</span>' : '')
                + (g.n ? '<br><span class="ge">' + fmt(g.n) + '</span>' : '') + '</div>';
            }).join('')
          + '</div>' : '')
      + (meta ? '<div class="meta">' + meta + '</div>' : '') + tr + ph
      + (s.needsBooking ? reminderBadgeHTML(s.leadDays || 0) : '')
      + '<div class="acts">' + nav + say + '</div>';
  }

  function renderPlan() {
    var d = trip.days[cur];
    var isToday = d.date === TODAY;
    var slots = d.slots || [];
    var states = slots.map(function (s) { return slotState(cur, s); });
    var openIdx = -1;
    if (isToday) {
      openIdx = states.indexOf('now');
      if (openIdx < 0) openIdx = states.indexOf('future');
    }
    var doneCount = states.filter(function (x) { return x === 'past'; }).length;

    var rows = slots.map(function (s, i) {
      var isNow = states[i] === 'now';
      var cls = states[i] === 'past' ? 'past' : ((isNow ? 'now' : (i === openIdx ? 'open' : 'future')) + (i === openIdx ? ' open' : ''));
      return '<li class="ti ' + cls + '" data-i="' + i + '">'
        + '<span class="tdot">' + (i + 1) + '</span>'
        + '<div class="tbody">'
        + '<button class="trow" type="button" aria-expanded="' + (i === openIdx) + '">'
        + '<span class="twhen">' + esc(s.time) + '</span>'
        + '<span class="tname"><span class="tn">' + esc(s.name) + '</span>'
        + (function () {
            /* 名字里已有「A → B」站名链 → 交通行只补线路名（否则两行都截断，反而看不到目的地）
               名字是地点（不含站名）→ 交通行补整条，含上下车站 */
            var m = String((s.transport && s.transport.mode) || '').trim();
            if (!m || m === '—') return '';
            var hint;
            if (String(s.name).indexOf('→') >= 0) {
              hint = m.split('／').map(function (x) { return x.trim().split(/\s+/)[0]; })
                .filter(function (x) { return x && !/^歩行|^步行|^站立|^免費|^—/.test(x); }).join('／');
            } else { hint = m; }
            if (!hint || hint === '歩行' || hint === '步行') return '';
            return '<span class="tmove">' + esc(hint) + '</span>';
          })()
        + '</span>'
        + '<span class="tchev">▾</span></button>'
        + '<div class="tdetail">' + detailHTML(s) + '</div>'
        + '</div></li>';
    }).join('');

    var tips = (d.tips || []).length
      ? '<div class="daytips"><ul>' + d.tips.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></div>' : '';
    var alts = (d.alternatives || []).map(function (x) {
      return '<div class="alt"><b>' + esc(x.label) + '</b><p>' + fmt(x.summary) + '</p></div>'; }).join('');
    var dining = (d.dining || []).length ? '<details class="diningbox"><summary>当日餐饮'
      + '<span class="cnt">' + d.dining.length + ' 处 · '
      + d.dining.map(function (m) { return esc(m.meal); }).join('・') + '</span></summary>'
      + '<div class="bd">' + d.dining.map(function (m) {
          return '<div class="meal"><span class="place">' + esc(m.meal) + '｜' + esc(m.place) + '</span> '
            + '<span class="hrs">' + esc(m.hours || '') + '</span><br>'
            + (m.dishes || []).map(function (x) { return '<span class="dish">' + esc(x.name) + ' <b>' + esc(x.price) + '</b></span>'; }).join('')
            + '</div>';
        }).join('') + '</div></details>' : '';

    set('v-plan', '<div class="dayhead"><span class="d">' + esc(d.date.slice(5).replace('-', '.')) + '</span>'
      + '<span class="t">' + esc(d.theme || '') + '</span>'
      + '<button class="allexp" id="allexp">全部展开</button></div>'
      + wxStripHTML(d)
      + '<div id="wxdec"></div>'
      + ((d.rest && d.rest.length) ? '<div class="restbox"><b>坐着歇一下</b>'
          + d.rest.map(function (r) { return '<span><i>' + esc(r.t) + '</i> ' + esc(r.w) + '</span>'; }).join('')
          + '</div>' : '')
      + (isToday && doneCount ? '<div class="pastsum">已完成 ' + doneCount + ' 项</div>' : '')
      + '<ol class="tl">' + rows + '</ol>'
      + tips + alts + dining);

    loadWx();

    Array.prototype.forEach.call(document.querySelectorAll('.ti'), function (li) {
      var btn = li.querySelector('.trow');
      if (btn) btn.addEventListener('click', function () {
        li.classList.toggle('open');
        btn.setAttribute('aria-expanded', li.classList.contains('open'));
      });
    });
    var ae = document.getElementById('allexp');
    if (ae) {
      var syncAll = function () {
        var lis = document.querySelectorAll('.ti'), nOpen = 0;
        Array.prototype.forEach.call(lis, function (li) { if (li.classList.contains('open')) nOpen++; });
        ae.textContent = (lis.length && nOpen === lis.length) ? '全部收起' : '全部展开';
      };
      ae.addEventListener('click', function () {
        var lis = document.querySelectorAll('.ti'), nOpen = 0;
        Array.prototype.forEach.call(lis, function (li) { if (li.classList.contains('open')) nOpen++; });
        var want = !(lis.length && nOpen === lis.length);
        Array.prototype.forEach.call(lis, function (li) { li.classList.toggle('open', want); });
        syncAll();
      });
      syncAll();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.photo button'), function (b) {
      b.addEventListener('click', function () {
        var d2 = document.createElement('div');
        d2.innerHTML = '<img src="' + esc(b.getAttribute('data-src')) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
        b.parentNode.replaceChild(d2.firstChild, b);
      });
    });
  }

  /* ── 贴士视图（含待办 / 行前须知 / 航班酒店 / 免责声明） ── */
  function renderTips() {
    var pt = trip.preTrip || {}, fl = trip.flights || {}, hj = trip.hotelJp || {};
    set('tipsBody',
      '<div class="grp"><h3>紧急</h3>' + (trip.emer || []).map(function (e) {
        return '<button class="ph" ' + (e.jp ? 'onclick="__say(' + attr(e.jp) + ',' + attr(e.romaji) + ',' + attr(e.cn) + ')"' : '') + '>'
          + '<span class="cn">' + esc(e.label) + (e.jp ? '' : '　' + esc(e.cn)) + '</span>'
          + (e.value ? '<span class="jpt" style="color:var(--shu)">' + esc(e.value) + '</span>' : '')
          + (e.jp ? '<span class="jpt jp">' + esc(e.jp) + '</span><span class="rot ro">' + esc(e.romaji)
            + '</span><span class="zoom">点开大字</span>' : '') + '</button>';
      }).join('') + '</div>'
      + '<div class="grp"><h3>酒店（给司机看）</h3><div class="hotel">'
      + '<div class="big jp">' + esc(hj.show) + '</div><div class="rot ro">' + esc(hj.romaji) + '</div>'
      + '<div class="cn">' + esc(hj.cn) + '</div><div class="ad">' + esc(hj.addr) + '</div>'
      + '<button class="ph" style="margin:9px 0 0" onclick="__say(' + attr(hj.show) + ',' + attr(hj.romaji) + ',' + attr(hj.cn) + ')">'
      + '<span class="zoom">点开大字</span></button></div></div>'
      + '<div class="warn"><b>全程最要命的一条</b>：10-06 航班 09:30 起飞，05:40 必须坐上 Skyliner。10-05 晚上 21:00 前睡，行李当晚打包好，并提前跟前台确认清晨退房。</div>'
      + '<details><summary>天气 · 台风 · 行李 · 支付</summary><div class="bd">'
      + '<span class="k">天气与穿着</span>' + fmt(pt.weather && pt.weather.summary)
      + '<span class="k">台风与灾害</span>' + fmt(pt.weather && pt.weather.typhoon)
      + '<span class="k">行李</span>' + fmt(pt.packing)
      + '<span class="k">支付</span>' + fmt(pt.payment)
      + '<span class="k">必备 App</span><ul style="margin:4px 0 0;padding-left:18px">'
      + (pt.apps || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>'
      + '<span class="k">购票时机</span>' + fmt(pt.ticketTip) + '</div></details>'
      + '<details><summary>航班与住宿</summary><div class="bd">'
      + (fl.booked || []).map(function (f) {
          return '<div class="row"><span class="code">' + esc(f.code) + '</span><span><b>' + esc(f.label)
            + '</b><span class="tag booked">已预订</span><br><span class="t">' + esc(f.time) + '</span></span></div>';
        }).join('')
      + '<p style="font-size:12.5px;color:var(--tx2);line-height:1.7;margin:9px 0 0">转机在香港（**联程票走禁区内转机**，航站楼与闸口以当天屏幕为准）：去程停 2 小时 50 分、返程 3 小时 40 分。落机后跟「転機／Transfer」指示牌走，不要出关。</p>'
      + (trip.hotelAreas || []).map(function (a) {
          return '<span class="k">' + esc(a.area) + '</span><p style="margin:0;font-size:13px;color:var(--tx2)">' + fmt(a.reason) + '</p>'
            + (a.options || []).map(function (o) {
                return '<div class="row"><span class="tier">' + esc(o.tier) + '</span><span><b>' + esc(o.name)
                  + '</b><br><span class="t">' + esc(o.priceRange) + '</span>'
                  + (o.note ? '<br><span class="t">' + fmt(o.note) + '</span>' : '') + '</span></div>';
              }).join('');
        }).join('')
      + '</div></details>'
      + '<details open><summary>硬规则（当天照着执行）</summary><div class="bd">'
      + '<p class="snote">' + fmt(trip.rulesNote || '') + '</p>'
      + (trip.rules || []).map(function (G) {
          return '<span class="k">' + esc(G.g) + '</span><ul class="rl">'
            + G.items.map(function (it) {
                return '<li><span class="rid">' + esc(it[0]) + '</span><span>' + fmt(it[1]) + '</span></li>';
              }).join('') + '</ul>';
        }).join('')
      + '</div></details>'
      + '<details open><summary>全程实用贴士</summary><div class="bd"><ul class="tips">'
      + (trip.tips || []).map(function (t, i) {
          return '<li><span class="n">' + p2(i + 1) + '</span><span>' + fmt(t) + '</span></li>';
        }).join('') + '</ul></div></details>');
  }

  /* ── 砍掉清单 ─────────────────────────── */
  function renderCut() {
    set('cutBody', '<p class="snote">' + fmt(trip.cutNote || '') + '</p>'
      + (trip.cutList || []).map(function (G) {
          return '<div class="grp"><h3>' + esc(G.g) + '</h3><ul class="cutl">'
            + G.items.map(function (it) {
                return '<li><span class="cw">' + esc(it[0]) + '</span><span class="cy">' + fmt(it[1]) + '</span></li>';
              }).join('') + '</ul></div>';
        }).join(''));
  }

  /* ── 实时天气：Open-Meteo（免密钥）＋ 30 分钟缓存 ──
     版面要点：天气条与对比卡都是「固定高度 + 骨架占位 + 缓存同步渲染」，
     所以数据到达时高度不变，页面不抖。 */
  var WMO={0:"晴",1:"晴时多云",2:"多云",3:"阴",45:"雾",48:"雾凇",51:"小毛毛雨",53:"毛毛雨",55:"大毛毛雨",
    56:"冻毛毛雨",57:"强冻毛毛雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"强冻雨",71:"小雪",73:"中雪",75:"大雪",
    77:"雪粒",80:"阵雨",81:"中阵雨",82:"强阵雨",85:"小阵雪",86:"大阵雪",95:"雷雨",96:"雷雨伴冰雹",99:"强雷雨伴冰雹"};
  function wmoText(c){ return WMO[c] || "—"; }

  var WX_TTL = 30 * 60 * 1000;
  var WXP = 'tokyo26.wx.v1.';
  var LS = (function () {
    try { localStorage.setItem('_probe', '1'); localStorage.removeItem('_probe'); return localStorage; }
    catch (e) { return null; }
  })();
  var wmem = {};
  function wKey(lat, lng, date) { return WXP + date + '@' + lat + ',' + lng; }
  function wGet(k) {
    if (wmem[k]) return wmem[k];
    if (!LS) return null;
    try { var v = JSON.parse(LS.getItem(k)); if (v && v.t && v.d) { wmem[k] = v; return v; } } catch (e) {}
    return null;
  }
  function wPut(k, d) {
    var v = { t: Date.now(), d: d };
    wmem[k] = v;
    if (LS) { try { LS.setItem(k, JSON.stringify(v)); } catch (e) {} }
  }
  function wDrop(k) { delete wmem[k]; if (LS) { try { LS.removeItem(k); } catch (e) {} } }
  function wPrune() {
    if (!LS) return;
    var dates = trip.days.map(function (x) { return x.date; });
    try {
      for (var i = LS.length - 1; i >= 0; i--) {
        var k = LS.key(i);
        if (!k || k.indexOf(WXP) !== 0) continue;
        if (dates.indexOf(k.slice(WXP.length, WXP.length + 10)) < 0) LS.removeItem(k);
      }
    } catch (e) {}
  }
  function wNet(lat, lng, date) {
    if (typeof fetch !== 'function') return Promise.resolve(null);
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
      + '&hourly=visibility,cloud_cover_low&timezone=Asia%2FTokyo&start_date=' + date + '&end_date=' + date;
    return fetch(u).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.daily || !j.daily.time || !j.daily.time.length) return null;
      var H = j.hourly || {}, i = (H.time || []).findIndex(function (x) { return x.slice(11, 16) === '12:00'; });
      var o = { code: j.daily.weather_code[0], tmax: j.daily.temperature_2m_max[0], tmin: j.daily.temperature_2m_min[0],
        pop: j.daily.precipitation_probability_max[0],
        vis: (i >= 0 && H.visibility) ? H.visibility[i] : null,
        low: (i >= 0 && H.cloud_cover_low) ? H.cloud_cover_low[i] : null };
      if (o.tmax === null || o.tmax === undefined) return null;
      return o;
    }).catch(function () { return null; });
  }
  function wxGet(lat, lng, date, force, onFresh) {
    var k = wKey(lat, lng, date), hit = force ? null : wGet(k);
    if (hit && (Date.now() - hit.t) < WX_TTL) return Promise.resolve(hit.d);
    if (force) wDrop(k);
    var net = wNet(lat, lng, date).then(function (o) {
      if (o) { wPut(k, o); if (onFresh) onFresh(o); }
      return o;
    });
    return hit ? Promise.resolve(hit.d) : net;
  }

  /* ── 天气条：高度锁死 42px，内容变但高度绝不变 ── */
  var WX_TAIL = '<span class="wxrf">↻</span><span class="src">Open-Meteo</span>';
  var WX_SKEL = '<span class="sk" style="width:38px"></span><span class="sk" style="width:54px"></span><span class="sk" style="width:58px"></span>';
  function wxHTML(o) {
    return '<span class="wt">' + wmoText(o.code) + '</span>'
      + '<span class="wn">' + Math.round(o.tmin) + '–' + Math.round(o.tmax) + '°C</span>'
      + '<span class="wpop">降水 ' + o.pop + '%</span>' + WX_TAIL;
  }
  function wxBase(d) {
    var cands = (d.slots || []).filter(function (s) { return !/空港|机场|スカイライナー/.test(s.name); });
    return cands[0] || (d.slots || [])[0];
  }
  function wxInit(lat, lng, date) {          // 同步：有缓存第一帧就有数字
    var hit = wGet(wKey(lat, lng, date));
    return (hit && hit.d) ? wxHTML(hit.d) : WX_SKEL + WX_TAIL;
  }
  function wxStripHTML(d) {
    var b = wxBase(d);
    return '<div class="wxstrip" id="wxstrip" role="button" tabindex="0"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();__wxRefresh()}"'
      + ' onclick="__wxRefresh()">'
      + (b ? wxInit(b.lat, b.lng, d.date) : WX_TAIL) + '</div>';
  }

  /* ── 对比卡：骨架与真值同为两行固定行高，进来时高度不变 ── */
  function wxCard(opts, vals, isToday) {
    return '<div class="wxcmp"><h4>' + (isToday ? '今天去哪更值' : '这天去哪更值') + '（实时预报对比）</h4>'
      + opts.map(function (a, i) {
          var o = vals && vals[i];
          return '<div class="opt"><b>' + esc(a.label) + '</b>'
            + '<span class="o1">' + (o ? wmoText(o.code) + '　' + Math.round(o.tmin) + '–' + Math.round(o.tmax) + '°C'
                : '<span class="sk" style="width:92px"></span>') + '</span>'
            + '<span class="o2">' + (o
                ? '低云 ' + (o.low === null ? '—' : o.low + '%')
                  + ' ・ 能见度 ' + (o.vis === null ? '—' : (o.vis / 1000).toFixed(1) + 'km')
                  + ' ・ 降水 ' + o.pop + '%'
                : '<span class="sk" style="width:168px"></span>') + '</span></div>';
        }).join('')
      + '<p class="hint">低云少、能见度高的那个更适合；能见度低就看不到远山。</p></div>';
  }

  function loadWx(force) {
    var d = trip.days[cur], base = wxBase(d);
    var strip = document.getElementById('wxstrip');
    var paint = function (o) {
      var el = document.getElementById('wxstrip');
      if (!el || !o) return;
      el.classList.remove('loading'); el.classList.remove('dead');
      el.innerHTML = wxHTML(o);
    };
    if (strip) { strip.classList.remove('dead'); if (force) strip.classList.add('loading'); }
    if (base) wxGet(base.lat, base.lng, d.date, force, paint).then(function (o) {
      if (o) { paint(o); return; }
      var el = document.getElementById('wxstrip');
      if (el && !wGet(wKey(base.lat, base.lng, d.date))) {   // 拿不到 → 明说，不留骨架
        el.classList.remove('loading'); el.classList.add('dead');
        el.innerHTML = '<span class="wt">无网络</span><span class="wpop">实时天气未取到</span>'
          + '<span class="wxrf">↻</span><span class="src">Open-Meteo</span>';
      }
    });

    var dec = document.getElementById('wxdec');
    var opts = (d.alternatives || []).filter(function (x) { return x.lat && x.lng; });
    if (dec) {
      if (opts.length < 2) dec.innerHTML = '';
      else {
        dec.innerHTML = wxCard(opts, opts.map(function (x) {     // 先把高度定死
          var h = wGet(wKey(x.lat, x.lng, d.date)); return h ? h.d : null;
        }), d.date === TODAY);
        Promise.all(opts.map(function (x) { return wxGet(x.lat, x.lng, d.date, force); })).then(function (rs) {
          if (rs.some(function (r) { return !r; })) {
            var el2 = document.getElementById('wxdec');
            if (el2 && el2.querySelector('.sk')) el2.innerHTML = '<div class="wxcmp">'
              + '<h4>' + (d.date === TODAY ? '今天去哪更值' : '这天去哪更值') + '（实时预报对比）</h4>'
              + '<p class="hint">无网络／未取到实时预报。出门前把 tenki.jp 与 気象庁 各看一次；'
              + '两个官方来源常常不一致（同一天一个报 30%、一个报 80%），**按差的那个做准备**。</p></div>';
            return;
          }
          var el = document.getElementById('wxdec');
          if (el) el.innerHTML = wxCard(opts, rs, d.date === TODAY);
        });
      }
    }
    wPrune();
  }
  window.__wxRefresh = function () { loadWx(true); };

  /* ── 抽屉（贴士 / 砍掉） ───────────────── */
  var SHEETS = ['tipsSheet', 'cutSheet'].map(function (id) { return document.getElementById(id); });
  function openSheet(el, on) {
    el.classList.toggle('on', on);
    document.body.style.overflow = on ? 'hidden' : '';
    if (on) { var b = el.querySelector('.sheet-body'); if (b) b.scrollTop = 0; }
  }
  function closeAll() { SHEETS.forEach(function (x) { openSheet(x, false); }); }
  document.getElementById('tipsbtn').addEventListener('click', function () { openSheet(document.getElementById('tipsSheet'), true); });
  document.getElementById('cutbtn').addEventListener('click', function () { openSheet(document.getElementById('cutSheet'), true); });
  document.getElementById('tipsClose').addEventListener('click', closeAll);
  document.getElementById('cutClose').addEventListener('click', closeAll);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

  /* ── 启动 ─────────────────────────────── */
  renderChips(); renderPlan(); renderTips(); renderCut(); tick();
  /* 行程中：自动滚到当前项一次 */
  (function () {
    if (trip.days[cur].date !== TODAY) return;
    var el = document.querySelector('.slot.now') || document.querySelector('.slot.future');
    if (el) setTimeout(function () { el.scrollIntoView({ block: 'center' }); }, 120);
  })();
})();
</script>
